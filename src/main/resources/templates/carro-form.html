<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Carro</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Cadastro de Carro</h2>

<form th:action="@{/carros/salvar}" th:object="${carro}" method="post">

    <input type="hidden" th:field="*{placa}">

    <input class="form-control mb-2" th:field="*{marca}" placeholder="Marca">
    <input class="form-control mb-2" th:field="*{modelo}" placeholder="Modelo">
    <input class="form-control mb-2" th:field="*{cor}" placeholder="Cor">

    <input class="form-control mb-2" th:field="*{ano}" placeholder="Ano">
    <input class="form-control mb-2" th:field="*{tpCombustivel}" placeholder="Combustível">
    <input class="form-control mb-2" th:field="*{quilometragem}" placeholder="KM">
    <input class="form-control mb-2" th:field="*{cambio}" placeholder="Câmbio">

    <!-- Categoria -->
    <select class="form-control mb-2" th:field="*{categoria.id}">
        <option th:each="c : ${categorias}"
                th:value="${c.id}"
                th:text="${c.nome}">
        </option>
    </select>

    <button class="btn btn-success">Salvar</button>

</form>

</body>
</html>
