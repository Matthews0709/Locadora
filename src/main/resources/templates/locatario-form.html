<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Locatário</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Cadastro de Locatário</h2>

<form th:action="@{/locatario/salvar}" th:object="${locatario}" method="post">

    <input class="form-control mb-2"
           th:field="*{cpf}"
           placeholder="CPF">

    <input class="form-control mb-2"
           th:field="*{nome}"
           placeholder="Nome">

    <input class="form-control mb-2"
           th:field="*{habilitacao}"
           placeholder="Número da habilitação">

    <input type="date"
           class="form-control mb-2"
           th:field="*{nascimento}">

    <input class="form-control mb-2"
           th:field="*{logradouro}"
           placeholder="Logradouro">

    <input class="form-control mb-2"
           type="number"
           th:field="*{numero}"
           placeholder="Número">

    <input class="form-control mb-2"
           th:field="*{cep}"
           placeholder="CEP">

    <input class="form-control mb-2"
           th:field="*{cidade}"
           placeholder="Cidade">

    <button class="btn btn-success">Salvar</button>

    <a href="/locatario" class="btn btn-secondary">Voltar</a>

</form>

</body>
</html>
