<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Aluguel</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Cadastro de Aluguel</h2>

<form th:action="@{/aluguel/salvar}" th:object="${aluguel}" method="post">

    <!-- CARRO -->
    <label>Carro</label>
    <select class="form-control mb-2" th:field="*{carro}">
        <option th:each="c : ${carros}"
                th:value="${c}"
                th:text="${c.marca + ' - ' + c.modelo}">
        </option>
    </select>

    <!-- LOCATARIO -->
    <label>Locatário</label>
    <select class="form-control mb-2" th:field="*{locatario}">
        <option th:each="l : ${locatarios}"
                th:value="${l}"
                th:text="${l.nome}">
        </option>
    </select>

    <!-- DIAS -->
    <input class="form-control mb-2"
           type="number"
           th:field="*{qtDias}"
           placeholder="Quantidade de dias">

    <button class="btn btn-success">Alugar</button>

</form>

<a href="/aluguel" class="btn btn-secondary mt-3">Voltar</a>

</body>
</html>
