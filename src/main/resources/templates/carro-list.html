<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Carros</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Lista de Carros</h2>

<!-- 🔎 FILTRO POR CATEGORIA -->
<form method="get" action="/carros/categoria" class="row g-2 mb-3">

    <div class="col-md-4">
        <input type="text" name="categoria" class="form-control" placeholder="Categoria do carro">
    </div>

    <div class="col-md-2">
        <button class="btn btn-primary">Filtrar</button>
    </div>

</form>

<!-- 🔘 BOTÃO CARROS DISPONÍVEIS -->
<a href="/carros/disponiveis" class="btn btn-success mb-3">
    Carros Disponíveis
</a>

<table class="table table-striped">

    <thead>
    <tr>
        <th>Placa</th>
        <th>Marca</th>
        <th>Modelo</th>
        <th>Cor</th>
        <th>Categoria</th>
        <th>Disponível</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="carro : ${carros}">
        <td th:text="${carro.placa}"></td>
        <td th:text="${carro.marca}"></td>
        <td th:text="${carro.modelo}"></td>
        <td th:text="${carro.cor}"></td>
        <td th:text="${carro.categoria.nome}"></td>
        <td th:text="${carro.disponibilidade}"></td>

        <td>
            <a th:href="@{/carros/editar/{placa}(placa=${carro.placa})}"
               class="btn btn-warning btn-sm">Editar</a>

            <a th:href="@{/carros/excluir/{placa}(placa=${carro.placa})}"
               class="btn btn-danger btn-sm">Excluir</a>

            <a th:href="@{/aluguel/cadastro/{placa}(placa=${carro.placa})}"
               class="btn btn-primary btn-sm">Alugar</a>

            <a th:href="@{/reparo/novo/{placa}(placa=${carro.placa})}"
               class="btn btn-dark btn-sm">Reparo</a>
        </td>
    </tr>
    </tbody>

</table>

<a href="/carros/novo" class="btn btn-success">Novo Carro</a>

</body>
</html>
