<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Aluguéis</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Lista de Aluguéis</h2>

<a href="/aluguel/cadastro" class="btn btn-primary mb-3">
    Novo Aluguel
</a>

<table class="table table-striped">

    <thead>
    <tr>
        <th>ID</th>
        <th>Carro</th>
        <th>Locatário</th>
        <th>Dias</th>
        <th>Data Retirada</th>
        <th>Valor Total</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="a : ${alugueis}">
        <td th:text="${a.id}"></td>
        <td th:text="${a.carro.modelo}"></td>
        <td th:text="${a.locatario.nome}"></td>
        <td th:text="${a.qtDias}"></td>
        <td th:text="${a.dataRetirada}"></td>
        <td th:text="${a.valorTotal}"></td>

        <td>

            <!-- DEVOLUÇÃO -->
            <form th:action="@{/aluguel/devolver/{id}(id=${a.id})}" method="get">

                <input type="number"
                       name="litrosFaltando"
                       placeholder="Litros faltando"
                       class="form-control mb-1">

                <label>
                    <input type="checkbox" name="danos">
                    Danos
                </label>

                <button class="btn btn-warning btn-sm">
                    Devolver
                </button>

            </form>

            <!-- EDITAR -->
            <a th:href="@{/aluguel/editar/{id}(id=${a.id})}"
               class="btn btn-info btn-sm">
                Editar
            </a>

            <!-- EXCLUIR -->
            <a th:href="@{/aluguel/excluir/{id}(id=${a.id})}"
               class="btn btn-danger btn-sm">
                Excluir
            </a>

        </td>
    </tr>
    </tbody>

</table>

</body>
</html>
