<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Locatários</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Lista de Locatários</h2>

<a href="/locatario/novo" class="btn btn-primary mb-3">
    Novo Locatário
</a>

<table class="table table-striped">

    <thead>
    <tr>
        <th>CPF</th>
        <th>Nome</th>
        <th>Habilitação</th>
        <th>Cidade</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="l : ${locatarios}">
        <td th:text="${l.cpf}"></td>
        <td th:text="${l.nome}"></td>
        <td th:text="${l.habilitacao}"></td>
        <td th:text="${l.cidade}"></td>

        <td>
            <a th:href="@{/locatario/editar/{cpf}(cpf=${l.cpf})}"
               class="btn btn-warning btn-sm">
                Editar
            </a>

            <a th:href="@{/locatario/excluir/{cpf}(cpf=${l.cpf})}"
               class="btn btn-danger btn-sm">
                Excluir
            </a>
        </td>
    </tr>
    </tbody>

</table>

<a href="/aluguel" class="btn btn-secondary">Ir para Aluguéis</a>

</body>
</html>
