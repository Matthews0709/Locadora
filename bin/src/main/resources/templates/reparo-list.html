<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Reparos</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Lista de Reparos</h2>

<a href="/reparo/novo" class="btn btn-primary mb-3">
    Novo Reparo
</a>

<table class="table table-striped">

    <thead>
    <tr>
        <th>ID</th>
        <th>Carro</th>
        <th>Descrição</th>
        <th>Entrada</th>
        <th>Dias</th>
        <th>Valor</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="r : ${reparos}">
        <td th:text="${r.id}"></td>
        <td th:text="${r.carro.modelo}"></td>
        <td th:text="${r.descricao}"></td>
        <td th:text="${r.entrada}"></td>
        <td th:text="${r.qtDiasReparo}"></td>
        <td th:text="${r.valor}"></td>

        <td>

            <!-- FINALIZAR REPARO -->
            <a th:href="@{/reparo/finalizar/{id}(id=${r.id})}"
               class="btn btn-success btn-sm">
                Finalizar
            </a>

            <!-- EXCLUIR -->
            <a th:href="@{/reparo/excluir/{id}(id=${r.id})}"
               class="btn btn-danger btn-sm">
                Excluir
            </a>

        </td>
    </tr>
    </tbody>

</table>

<a href="/carros" class="btn btn-secondary">Voltar para Carros</a>

</body>
</html>
