<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Reparo</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Cadastro de Reparo</h2>

<form th:action="@{/reparo/salvar}" th:object="${reparo}" method="post">

    <!-- CARRO -->
    <label>Carro</label>
    <select class="form-control mb-2" th:field="*{carro}">
        <option th:each="c : ${carros}"
                th:value="${c}"
                th:text="${c.marca + ' - ' + c.modelo}">
        </option>
    </select>

    <input class="form-control mb-2"
           th:field="*{descricao}"
           placeholder="Descrição do problema">

    <input class="form-control mb-2"
           type="number"
           th:field="*{qtDiasReparo}"
           placeholder="Dias de reparo">

    <input class="form-control mb-2"
           type="number"
           step="0.01"
           th:field="*{valor}"
           placeholder="Valor do reparo">

    <button class="btn btn-success">Salvar</button>

</form>

<a href="/reparo" class="btn btn-secondary mt-3">Voltar</a>

</body>
</html>
