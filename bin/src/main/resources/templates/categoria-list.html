<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Categorias</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body class="container mt-4">

<h2>Lista de Categorias</h2>

<a href="/categoria/novo" class="btn btn-primary mb-3">
    Nova Categoria
</a>

<table class="table table-striped">

    <thead>
    <tr>
        <th>ID</th>
        <th>Nome</th>
        <th>Valor da Diária</th>
        <th>Ações</th>
    </tr>
    </thead>

    <tbody>
    <tr th:each="c : ${categorias}">
        <td th:text="${c.id}"></td>
        <td th:text="${c.nome}"></td>
        <td th:text="${c.valorDiaria}"></td>

        <td>
            <a th:href="@{/categoria/editar/{id}(id=${c.id})}"
               class="btn btn-warning btn-sm">
                Editar
            </a>

            <a th:href="@{/categoria/excluir/{id}(id=${c.id})}"
               class="btn btn-danger btn-sm">
                Excluir
            </a>
        </td>
    </tr>
    </tbody>

</table>

<a href="/carros" class="btn btn-secondary">Voltar para Carros</a>

</body>
</html>
